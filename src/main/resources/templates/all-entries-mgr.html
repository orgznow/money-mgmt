<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="en">

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Store Visits</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
        <script src="js/jquery-3.7.1.min.js"></script>
        <script src="js/all-entries-mgr.js"></script>
    </head>

    <body>

        <br/>

        <!-- The div for the entry form for new establishment/store visit -->
        <div class="container-fluid">

            <h3 class="text-center">Add New Store Visit</h3>

            <!-- The entry form for new establishment/store visit -->
            <form action="#" th:action="@{/all-entries-mgr}" th:object="${establishmentVisit}" method="post">

                <fieldset>

                    <!-- Row 1:: Date of visit, Total Amount, Tax Percentage, Store, Tx Type -->
                    <div class="row g-2">

                        <div class="col-md-2 p-2">
                            <label th:for="visitDate">Date of visit</label>
                            <input type="date" th:field="*{visitDate}"/>
                        </div>

                        <div class="col-md-2 p-2">
                            <label th:for="visitTotalAmount">Total Amount</label>
                            <input type="number" step="0.01" min="-99999.99" max="99999.99" value="0.0" th:field="*{visitTotalAmount}"/>
                        </div>

                        <div class="col-md-2 p-2">
                            <label th:for="taxPercentage">Tax Percentage</label>
                            <input type="number" step="0.01" min="0.0" max="100.0" value="7.5" th:field="*{taxPercentage}"/>
                        </div>

                        <div class="col-md-3 p-2">
                            <label th:for="establishmentId">Store</label>
                            <select th:field="*{establishmentId}">
                                <option th:each="store: ${allStores}" th:value="${store.id}" th:text="${store.name}"/>
                            </select>
                        </div>

                        <div class="col-md-2 col-md-offset-3 p-2">
                            <label th:for="transactionTypeId">Tx Type</label>
                            <select th:field="*{transactionTypeId}">
                                <option th:each="txType: ${allTxTypes}" th:value="${txType.id}" th:selected="${txType.isDefault == true}" th:text="${txType.name}"/>
                            </select>
                        </div>

                    </div>

                    <!-- Row 2:: Description, Comments -->
                    <div class="row g-2">

                        <div class="col-md-6 p-2">
                            <label th:for="description">Description</label>
                            <input type="text" size="51" th:field="*{description}" id="visitDescription"/>
                        </div>

                        <div class="col-md-6 p-2">
                            <label th:for="comments">Comments</label>
                            <input type="text" size="63" th:field="*{comments}"/>
                        </div>

                    </div>

                    <!-- Row 3:: Table for line item entries for establishment/store visit with final grand total row:
                            Description, Rate, Qty, Unit Type, Base Amt, Discount Amt, Tax?, Tax Amt, Tip Amt, Final Amt, Comments, Category, (Button)
                    -->
                    <div class="row g-2 table-responsive">
                        <table class="table table-bordered table-condensed table-sm table-hover">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Description</th>
                                <th>Rate</th>
                                <th>Qty</th>
                                <th>Unit Type</th>
                                <th>Base Amt</th>
                                <th>Discount Amt</th>
                                <th>Tax?</th>
                                <th>Tax Amt</th>
                                <th>Tip Amt</th>
                                <th>Final Amt</th>
                                <th>Comments</th>
                                <th>Category</th>
                                <th>
                                    <button type="submit" id="addItemBtn" name="addItem" class="btn-lg">Add Item</button>
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr class="journalEntriesRows" th:each="item, itemStat : *{journalEntries}">
                                <td th:text="${itemStat.count}"/>
                                <td>
                                    <input type="text" class="journalEntriesDescription" size="18" th:field="*{journalEntries[__${itemStat.index}__].description}"/>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesRate" step="0.01" min="-99999.99" max="99999.99" value="0.0" th:field="*{journalEntries[__${itemStat.index}__].rateAmount}"/>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesQuantity" step="0.01" min="0.01" max="99" value="1.0" th:field="*{journalEntries[__${itemStat.index}__].quantity}"/>
                                </td>
                                <td>
                                    <select th:field="*{journalEntries[__${itemStat.index}__].unitTypeId}">
                                        <option th:each="unitType : ${allUnitTypes}" th:value="${unitType.id}" th:text="${unitType.name}" th:selected="${unitType.isDefault}"/>
                                    </select>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesBaseAmount" step="0.01" min="-99999" max="99999.99" value="0.0" th:field="*{journalEntries[__${itemStat.index}__].baseAmount}"/>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesDiscountAmount" step="0.01" min="-99999" max="99999" value="0.0" th:field="*{journalEntries[__${itemStat.index}__].discountAmount}"/>
                                </td>
                                <td>
                                    <input type="checkbox" class="journalEntriesIsTaxable" th:field="*{journalEntries[__${itemStat.index}__].isTaxable}"/>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesTaxAmount" step="0.01" min="-999" max="999" value="0.0" th:field="*{journalEntries[__${itemStat.index}__].taxAmount}"/>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesTipAmount" step="0.01" min="-999" max="999" value="0.0" th:field="*{journalEntries[__${itemStat.index}__].tipAmount}"/>
                                </td>
                                <td>
                                    <input type="number" class="journalEntriesFinalAmount" step="0.01" min="-99999" max="99999" value="0.0" th:field="*{journalEntries[__${itemStat.index}__].finalAmount}"/>
                                </td>
                                <td>
                                    <input type="text" size="10" th:field="*{journalEntries[__${itemStat.index}__].comments}"/>
                                </td>
                                <td>
                                    <select class="journalEntriesSpendCategory" th:field="*{journalEntries[__${itemStat.index}__].spendCategoryId}">
                                        <option th:each="categoryType : ${allCategories}" th:value="${categoryType.id}" th:text="${categoryType.name}" th:selected="${categoryType.isDefault}"/>
                                    </select>
                                </td>
                                <td>
                                    <button type="submit" name="removeItem" class="btn-lg" th:value="${itemStat.index}" >Delt Item</button>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="10" class="text-end">Grand Total</td>
                                <td class="text-start" id="visitGrandTotal"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Row 4:: Submit button -->
                    <div class="row">
                        <div class="p-3 text-center">
                            <button type="submit" id="addStoreVisitBtn" name="save" class="col">Add Store Visit</button>
                        </div>
                    </div>

                </fieldset>

           </form>

        </div>

        <!-- The div for the entry form for setting the month/year for display of store visit data -->
        <div class="container-fluid">

            <hr class="border border-dark"/>

            <!-- The entry form for setting the month/year for display of store visit data -->
            <form action="#" th:action="@{/all-entries-mgr}" th:object="${displayMonthYear}" method="post">

                <fieldset>

                    <div class="row g-2">

                        <div class="p-3 text-center">
                            <label th:for="displayMonthYear">Display Month/Year:</label>
                            <input type="month" th:field="*{displayMonthYear}" onchange="this.form.submit()"/>
                        </div>

                    </div>

                </fieldset>

            </form>

        </div>

        <!-- The div for the display of summary and details of existing store visit data -->
        <div class="container-fluid" th:unless="${#lists.isEmpty(allStoreVisitsInfo.allStoreVisits)}">

            <!-- Collapsible to display summarization data by weeks of the month  -->
            <details>
                <summary>
                    <button type="button" class="btn btn-default" aria-label="Left Align">
                        <span class="glyphicon glyphicon-hand-down" aria-hidden="true"></span>
                        <strong> Summary (To Date) ... </strong>
                        <em th:text="${allStoreVisitsInfo.toDateSummary.weeklySpendTotals}"/>
                        <em th:text="${allStoreVisitsInfo.toDateSummary.monthToDateTotals}"/>
                    </button>
                </summary>

                <!-- Table to display summarization data by week and category -->
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Week</th>
                            <th>Category Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="spend: ${allStoreVisitsInfo.weeklySpendByCategories.entrySet()}">
                            <td th:text="${spend.key}"/>
                            <td>
                                <table class="table table-bordered table-hover">
                                    <tbody>
                                        <tr th:each="categoryDetail: ${spend.value.entrySet()}">
                                            <td th:text="${categoryDetail.key}"/>
                                            <td th:text="${categoryDetail.value}"/>
                                        </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Table to display summarization data by week and tx type -->
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Week</th>
                            <th>Tx Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="spend: ${allStoreVisitsInfo.weeklySpendByTxTypes.entrySet()}">
                            <td th:text="${spend.key}"/>
                            <td>
                                <table class="table table-bordered table-hover">
                                    <tbody>
                                    <tr th:each="txDetail: ${spend.value.entrySet()}">
                                        <td th:text="${txDetail.key}"/>
                                        <td th:text="${txDetail.value}"/>
                                    </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </details>

            <hr class="border border-dark"/>

            <h3 class="text-center">Store Visits</h3>

            <hr class="border border-dark"/>

            <!-- Table to display all existing establishment/store visits:
                    Date, Store, Total, Details, Tx Type, Items
             -->
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Store</th>
                        <th>Total</th>
                        <th>Details</th>
                        <th>Tx Type</th>
                        <th>Items</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="visit: ${allStoreVisitsInfo.allStoreVisits}">
                        <td th:text="${visit.visitDateString}"/>
                        <td th:text="${visit.establishment.name}"/>
                        <td th:text="${visit.visitTotalAmount}"/>
                        <td>
                            <table>
                                <tbody>
                                    <tr>
                                        <td th:text="${visit.description}"/>
                                    </tr>
                                    <tr>
                                        <td th:text="${visit.formattedComments}"/>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                        <td th:text="${visit.transactionType.name}"/>
                        <td>
                            <!-- Collapsible to display all line items per establishment/store visit -->
                            <details>
                                <summary>
                                    <button type="button" class="btn btn-default" aria-label="Left Align">
                                        <span class="glyphicon glyphicon-hand-down" aria-hidden="true"></span> Details ...
                                    </button>
                                </summary>
                                <!-- Sub table to display all line items per establishment/store visit:
                                        #, Description, Final Amount, Comments, Category
                                 -->
                                <table class="table table-bordered">
                                    <tbody>
                                        <tr th:each="item, itemStat : ${visit.journalEntries}">
                                            <td th:text="${itemStat.count}"/>
                                            <td th:text="${item.description}"/>
                                            <td th:text="${item.finalAmount}"/>
                                            <td th:text="${item.comments}"/>
                                            <td th:text="${item.spendCategory.name}"/>
                                        </tr>
                                    </tbody>
                                </table>
                            </details>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </body>

</html>
